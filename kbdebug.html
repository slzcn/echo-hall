<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Echo Hall 键盘诊断（小米18 Fold 专用）</title>
<style>
  html,body{margin:0;padding:0;background:#111;color:#0f0;font:14px/1.5 monospace;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  body{padding:12px}
  h1{color:#fc0;font-size:15px;margin:0 0 8px}
  .card{background:#000;border:1px solid #0f0;border-radius:8px;padding:10px;margin-bottom:10px}
  .card h2{color:#0ff;font-size:13px;margin:0 0 6px}
  input{width:100%;padding:14px;font-size:16px;background:#222;color:#fff;border:2px solid #0f0;border-radius:8px;box-sizing:border-box}
  .row{margin:2px 0;white-space:pre}
  .k{color:#fc0}
  .v{color:#0f0}
  .warn{color:#f66}
  .ok{color:#6f6}
  #tips{background:#331;color:#ffa;padding:10px;border-radius:6px;margin-top:10px}
</style>
</head>
<body>
<h1>🔬 键盘诊断（小米18 Fold）</h1>

<!-- ★超大结论横幅：即使截图糊字，也能从色块/大字判读关键结论 -->
<div id="verdict" style="font:bold 34px/1.25 sans-serif;text-align:center;padding:18px 10px;margin-bottom:12px;border-radius:10px;background:#222;color:#fff">等待键盘弹起…</div>

<div class="card">
  <h2>👆 请点这个输入框弹起键盘，然后看下方数据</h2>
  <input type="text" placeholder="点这里弹起键盘，输入随便什么" id="probe" autocomplete="off">
</div>

<div class="card">
  <h2>📐 视口尺寸（每帧更新）</h2>
  <div id="dims" class="row"></div>
</div>

<div class="card">
  <h2>⚙️ 媒体查询（决定 Echo Hall 走哪套 CSS）</h2>
  <div id="mq" class="row"></div>
</div>

<div class="card">
  <h2>⌨️ VirtualKeyboard API</h2>
  <div id="vk" class="row"></div>
</div>

<div class="card">
  <h2>📸 可视区截图数值</h2>
  <div id="vp" class="row"></div>
</div>

<div class="card">
  <h2>🧪 模拟 Echo Hall visibleHeight() 计算</h2>
  <div id="vh" class="row"></div>
</div>

<div id="tips">
提示：<br>
1. 点上面输入框弹起键盘<br>
2. 数值会实时刷新<br>
3. 请截图整个页面发给小龙虾<br>
4. 如果能，键盘弹起时截一张、收起时截一张
</div>

<script>
(function(){
  var virtualKeyboard = navigator.virtualKeyboard;
  var baseFullH = 0;
  var estimatedKbH = 0;
  var chatFocused = false;

  // 简单复刻 keyboard.js 的 visibleHeight
  function ehVisibleH(){
    var vv = window.visualViewport;
    var vis = window.innerHeight;
    if (vv && vv.height) vis = Math.min(vis, vv.height);
    var full = Math.max(baseFullH||0, window.innerHeight, vv?vv.height:0);
    var vkH = 0;
    try{ var r = virtualKeyboard && virtualKeyboard.boundingRect; if(r && r.height>0) vkH = Math.round(r.height); }catch(e){}
    if (vkH > 0) vis = Math.min(vis, full - vkH);
    if (estimatedKbH > 0) vis = Math.min(vis, full - estimatedKbH);
    return Math.max(1, Math.round(vis));
  }

  // 试着开启 VK API
  try{ if(virtualKeyboard){ virtualKeyboard.overlaysContent = false; } }catch(e){}

  function h(txt){ return '<span class="k">'+txt+'</span>' }
  function v(val){ return '<span class="v">'+val+'</span>' }

  var probe = document.getElementById('probe');
  probe.addEventListener('focus', function(){ chatFocused = true; if(!baseFullH) baseFullH = window.innerHeight; });
  probe.addEventListener('blur', function(){ chatFocused = false; });

  function tick(){
    var vv = window.visualViewport;
    var vkH = 0, vkY = -1;
    try{ var r = virtualKeyboard && virtualKeyboard.boundingRect; if(r && r.height>0){ vkH = Math.round(r.height); vkY = Math.round(r.y);} }catch(e){}

    var mqLow640 = window.matchMedia('(max-width:640px)').matches;
    var mqLow480 = window.matchMedia('(max-width:480px)').matches;
    var mqLow900 = window.matchMedia('(max-width:900px)').matches;
    var mqCoarse = window.matchMedia('(hover:none) and (pointer:coarse)').matches;
    var mqFine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;

    document.getElementById('dims').innerHTML =
      h('innerWidth  = ')+v(window.innerWidth)+'\n'+
      h('innerHeight = ')+v(window.innerHeight)+'\n'+
      h('screen.width  = ')+v(screen.width)+'\n'+
      h('screen.height = ')+v(screen.height)+'\n'+
      h('dpr = ')+v(window.devicePixelRatio)+'\n'+
      h('outerWidth = ')+v(window.outerWidth)+'  outerHeight = '+window.outerHeight;

    document.getElementById('mq').innerHTML =
      h('(max-width:480px)  = ')+v(mqLow480+(mqLow480?'  <-- 命中':''))+'\n'+
      h('(max-width:640px)  = ')+v(mqLow640+(mqLow640?'  <-- 命中(满屏 hall 生效)':'  <-- 不命中！(hall 卡桌面 max-height:92dvh)'))+'\n'+
      h('(max-width:900px)  = ')+v(mqLow900)+'\n'+
      h('(hover:none)+(pointer:coarse) = ')+v(mqCoarse+(mqCoarse?'  <-- keyboard.js 认为是触屏':''))+'\n'+
      h('(hover:hover)+(pointer:fine)  = ')+v(mqFine);

    document.getElementById('vk').innerHTML =
      h('navigator.virtualKeyboard 存在? ')+v(virtualKeyboard?'YES':'NO')+'\n'+
      h('boundingRect.height = ')+v(vkH)+'\n'+
      h('boundingRect.y = ')+v(vkY===-1?'-':vkY)+'\n'+
      h('overlaysContent = ')+v(virtualKeyboard?virtualKeyboard.overlaysContent:'-');

    document.getElementById('vp').innerHTML =
      h('visualViewport 存在? ')+v(vv?'YES':'NO')+'\n'+
      h('vv.height = ')+v(vv?Math.round(vv.height):'-')+'\n'+
      h('vv.offsetTop = ')+v(vv?Math.round(vv.offsetTop):'-')+'\n'+
      h('vv.pageTop = ')+v(vv?Math.round(vv.pageTop):'-')+'\n'+
      h('vv.scale = ')+v(vv?vv.scale.toFixed(2):'-')+'\n'+
      h('vv.width = ')+v(vv?Math.round(vv.width):'-');

    var visH = ehVisibleH();
    var kbUp = (vv && vv.height < window.innerHeight - 50) || vkH > 0;
    var expectedHallH = visH;  // Echo Hall #hall.style.height 会被写成这个
    document.getElementById('vh').innerHTML =
      h('chatFocused (模拟) = ')+v(chatFocused)+'\n'+
      h('baseFullH (模拟) = ')+v(baseFullH)+'\n'+
      h('estimatedKbH = ')+v(estimatedKbH)+'\n'+
      h('键盘弹起? = ')+v(kbUp?'YES':'NO')+'\n'+
      h('ehVisibleH() = ')+v(visH)+' px\n'+
      h('#hall 会被写成 = ')+v(expectedHallH)+' px\n'+
      h('是否满足触屏软键盘布局 = ')+v(mqCoarse?'YES':'NO (走桌面布局！)');

    // ★ 超大结论横幅（糊图也能从色块判读）
    var verdict = document.getElementById('verdict');
    if (!kbUp) {
      verdict.style.background = '#333';
      verdict.style.color = '#fff';
      verdict.innerHTML = '键盘未弹起<br><span style="font-size:20px;font-weight:normal">请点上面输入框</span>';
    } else {
      // 弹起后判定：
      // A) 640px 的 media query 命中不命中
      // B) ehVisibleH() 够不够放 composer（需 ≥ 200px，hall 内需留给 stream + composer）
      var lines = [];
      var bg = '#0a3';  // 默认绿
      if (!mqLow640) {
        lines.push('❌ 640px 断点未命中');
        lines.push('<span style="font-size:18px;font-weight:normal">→ hall 走桌面 CSS（max-height:92dvh）</span>');
        bg = '#c33';
      } else {
        lines.push('✅ 640px 断点命中');
        lines.push('<span style="font-size:18px;font-weight:normal">iw=' + window.innerWidth + '</span>');
      }
      lines.push('<span style="font-size:22px">visH=' + visH + 'px</span>');
      if (visH < 200) {
        lines.push('<span style="font-size:18px;font-weight:normal">❌ hall 太矮，composer 会被裁</span>');
        bg = '#c33';
      }
      verdict.style.background = bg;
      verdict.style.color = '#fff';
      verdict.innerHTML = lines.join('<br>');
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // 视口变化时提示
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){ /* just refresh via tick */ });
  }
})();
</script>
</body>
</html>
