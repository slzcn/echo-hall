<!doctype html>
<!-- ★归档原型(未接入主站): 联机斗地主的独立实验页, 已被 index.html + js/games/table-net.js 联机桌取代。
     仅作设计存档, 勿在生产链路引用。参见 README「项目结构」。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>斗地主 · DDZ Prototype</title>
<style>
/* ======================== 全局重置 ======================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --neon-green:#00FF9C;
  --neon-orange:#FF6B35;
  --neon-purple:#7B2FFF;
  --bg-dark:#0a0a12;
  --bg-card:#161628;
  --bg-panel:#11111e;
  --text-dim:#6a6a8a;
  --text-bright:#e0e0f0;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg-dark);
  color:var(--text-bright);
  font-family:'Courier New','PingFang SC','Microsoft YaHei',monospace;
  font-size:14px;
  line-height:1.4;
}

/* ======================== 扫描线 ======================== */
.scanlines{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(
    0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,
    rgba(0,255,156,0.03) 3px,rgba(0,255,156,0.03) 4px
  );
  animation:scanline-move 8s linear infinite;
}
@keyframes scanline-move{0%{transform:translateY(0)}100%{transform:translateY(4px)}}

/* ======================== 屏幕切换 ======================== */
.screen{display:none;width:100%;height:100%;position:absolute;top:0;left:0}
.screen.active{display:flex}

/* ======================== 大厅 ======================== */
#lobby{
  flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(ellipse at center,rgba(123,47,255,0.15) 0%,var(--bg-dark) 70%);
}
#lobby h1{
  font-size:48px;letter-spacing:8px;
  color:var(--neon-green);
  text-shadow:0 0 10px var(--neon-green),0 0 20px var(--neon-green),0 0 40px rgba(0,255,156,0.5);
  animation:glow-pulse 3s ease-in-out infinite alternate;
}
#lobby .subtitle{color:var(--text-dim);font-size:12px;letter-spacing:4px;margin-top:-12px}
#lobby input{
  background:var(--bg-panel);border:1px solid var(--neon-purple);
  color:var(--text-bright);padding:12px 20px;border-radius:4px;
  font-size:16px;font-family:inherit;width:260px;text-align:center;
  box-shadow:0 0 8px rgba(123,47,255,0.3);
}
#lobby input:focus{outline:none;border-color:var(--neon-green);box-shadow:0 0 12px var(--neon-green)}
#lobby .room-row{display:flex;gap:10px;align-items:center}
#lobby .room-row input{width:140px}
.btn{
  background:transparent;border:1px solid var(--neon-green);
  color:var(--neon-green);padding:12px 24px;border-radius:4px;
  font-size:14px;font-family:inherit;cursor:pointer;letter-spacing:2px;
  text-transform:uppercase;transition:all .2s;
  box-shadow:0 0 6px rgba(0,255,156,0.2);
}
.btn:hover{background:rgba(0,255,156,0.1);box-shadow:0 0 15px var(--neon-green)}
.btn:active{transform:scale(0.97)}
.btn.orange{border-color:var(--neon-orange);color:var(--neon-orange);box-shadow:0 0 6px rgba(255,107,53,0.2)}
.btn.orange:hover{background:rgba(255,107,53,0.1);box-shadow:0 0 15px var(--neon-orange)}
.btn.purple{border-color:var(--neon-purple);color:#c77dff;box-shadow:0 0 6px rgba(123,47,255,0.2)}
.btn.purple:hover{background:rgba(123,47,255,0.15);box-shadow:0 0 15px var(--neon-purple)}
.btn:disabled{opacity:0.3;cursor:not-allowed}
@keyframes glow-pulse{0%{text-shadow:0 0 10px var(--neon-green),0 0 20px var(--neon-green)}100%{text-shadow:0 0 15px var(--neon-green),0 0 30px var(--neon-green),0 0 50px rgba(0,255,156,0.6)}}

/* ======================== 等待室 ======================== */
#waiting{
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(ellipse at center,rgba(0,255,156,0.08) 0%,var(--bg-dark) 70%);
}
#waiting h2{color:var(--neon-green);letter-spacing:4px;font-size:22px}
#roomCodeDisplay{
  font-size:36px;letter-spacing:10px;color:var(--neon-orange);
  text-shadow:0 0 10px var(--neon-orange);font-weight:bold;
}
.waiting-player{
  background:var(--bg-card);border:1px solid var(--neon-purple);
  padding:10px 20px;border-radius:4px;margin:4px;width:200px;text-align:center;
  box-shadow:0 0 6px rgba(123,47,255,0.2);
}
.waiting-player.host{border-color:var(--neon-green);box-shadow:0 0 8px rgba(0,255,156,0.3)}
.waiting-player.ai{border-color:var(--text-dim);opacity:0.7}
#countdown{color:var(--neon-orange);font-size:18px}

/* ======================== 游戏界面 ======================== */
#game{
  flex-direction:column;
  background:var(--bg-dark);
}
#topBar{
  display:flex;align-items:center;gap:20px;
  padding:6px 16px;background:var(--bg-panel);
  border-bottom:1px solid rgba(0,255,156,0.2);
  font-size:12px;letter-spacing:1px;z-index:10;
}
#topBar .label{color:var(--text-dim)}
#topBar .val{color:var(--neon-green)}
#topBar .mult{color:var(--neon-orange);font-weight:bold}

#gameBody{display:flex;flex:1;overflow:hidden}

#boardWrap{
  flex:1;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(ellipse at 50% 40%,rgba(123,47,255,0.08) 0%,transparent 60%),
    radial-gradient(ellipse at 30% 70%,rgba(0,255,156,0.05) 0%,transparent 50%),
    var(--bg-dark);
}

/* 对手区域 */
.opponents{
  display:flex;justify-content:space-between;
  padding:10px 20px 0;
}
.opponent{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  min-width:120px;
}
.opponent .name{
  font-size:12px;color:var(--text-dim);letter-spacing:1px;
}
.opponent.active .name{color:var(--neon-green);text-shadow:0 0 8px var(--neon-green)}
.opponent .role{
  font-size:10px;padding:1px 6px;border-radius:2px;
}
.opponent .role.landlord{
  background:rgba(255,107,53,0.2);color:var(--neon-orange);
  border:1px solid var(--neon-orange);
}
.opponent .role.peasant{
  background:rgba(0,255,156,0.1);color:var(--neon-green);
  border:1px solid rgba(0,255,156,0.4);
}
.opponent .card-count{
  font-size:24px;color:var(--neon-green);font-weight:bold;
  text-shadow:0 0 6px rgba(0,255,156,0.4);
}
.opponent .card-backs{
  display:flex;gap:-8px;
}
.opponent .timer-ring{
  width:40px;height:40px;border:2px solid transparent;
  border-radius:50%;border-top-color:var(--neon-orange);
  animation:spin 1s linear infinite;
  display:none;
}
.opponent.turn .timer-ring{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* 出牌区 */
#playArea{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  padding:10px;
}
#playArea .played-zone{
  display:flex;gap:4px;flex-wrap:wrap;justify-content:center;
  min-height:80px;align-items:center;
}
#playArea .played-by{font-size:11px;color:var(--text-dim)}
#playArea .pass-indicator{
  font-size:20px;color:var(--neon-orange);
  text-shadow:0 0 8px var(--neon-orange);letter-spacing:4px;
}
#playArea .empty-hint{color:var(--text-dim);font-size:12px}

/* 底牌区 */
#bottomCards{
  display:flex;gap:6px;justify-content:center;
  padding:4px;
}
#bottomCards .label{color:var(--text-dim);font-size:11px;align-self:center;margin-right:6px}

/* 我的手牌 */
#myHandArea{
  display:flex;gap:3px;justify-content:center;
  padding:8px 16px;flex-wrap:nowrap;overflow-x:auto;
  min-height:100px;
}
#myHandArea .empty-hand{color:var(--text-dim);align-self:center}

/* 控制区 */
#controls{
  display:flex;gap:10px;justify-content:center;
  padding:6px 16px 10px;
  min-height:50px;
}

/* ======================== 卡牌样式 ======================== */
.card{
  display:inline-flex;flex-direction:column;align-items:center;
  width:42px;height:60px;border-radius:4px;
  background:var(--bg-card);
  border:1px solid rgba(255,255,255,0.15);
  position:relative;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  flex-shrink:0;
}
.card .rank{font-size:14px;font-weight:bold;line-height:1;margin-top:4px}
.card .suit{font-size:12px;line-height:1;margin-top:2px}
.card.red .rank,.card.red .suit{color:var(--neon-orange)}
.card.black .rank,.card.black .suit{color:var(--neon-green)}
.card.joker-small .rank,.card.joker-small .suit{color:#c77dff}
.card.joker-big .rank,.card.joker-big .suit{color:#FFD700}
.card:hover{transform:translateY(-8px);box-shadow:0 4px 12px rgba(0,255,156,0.3)}
.card.selected{
  transform:translateY(-16px);
  box-shadow:0 0 10px var(--neon-green),0 4px 12px rgba(0,255,156,0.4);
  border-color:var(--neon-green);
}
.card.disabled{cursor:default;opacity:0.5}
.card.disabled:hover{transform:none;box-shadow:none}
.card.back{
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#1a1a2e 100%);
  border:1px solid var(--neon-purple);
  cursor:default;
}
.card.back::before{
  content:'◈';color:rgba(123,47,255,0.4);font-size:18px;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
}
.card.back:hover{transform:none;box-shadow:none}
.card.back.mini{width:24px;height:34px}
.card.back.mini::before{font-size:10px}
.card.played{cursor:default}
.card.played:hover{transform:none;box-shadow:none}
.card.flip-anim{animation:card-flip .6s ease-in-out}
@keyframes card-flip{
  0%{transform:rotateY(180deg) scale(0.8)}
  50%{transform:rotateY(90deg) scale(1.1)}
  100%{transform:rotateY(0deg) scale(1)}
}

/* ======================== 聊天侧栏 ======================== */
#chatSidebar{
  width:240px;background:var(--bg-panel);
  border-left:1px solid rgba(0,255,156,0.15);
  display:flex;flex-direction:column;
  flex-shrink:0;
}
#chatSidebar h3{
  padding:8px 10px;font-size:11px;color:var(--text-dim);
  letter-spacing:2px;border-bottom:1px solid rgba(0,255,156,0.1);
}
#chatMessages{
  flex:1;overflow-y:auto;padding:6px 8px;
  display:flex;flex-direction:column;gap:4px;
  font-size:12px;
}
#chatMessages .chat-msg{
  padding:3px 6px;border-radius:3px;
  word-break:break-word;
}
#chatMessages .chat-msg .nick{color:var(--neon-purple);font-weight:bold;margin-right:4px}
#chatMessages .chat-msg .text{color:var(--text-bright)}
#chatMessages .chat-msg.system{color:var(--text-dim);font-style:italic}
#chatMessages .chat-msg.system .nick{color:var(--neon-orange)}
#chatInputRow{display:flex;padding:6px;gap:4px;border-top:1px solid rgba(0,255,156,0.1)}
#chatInput{
  flex:1;background:var(--bg-dark);border:1px solid rgba(123,47,255,0.3);
  color:var(--text-bright);padding:6px 8px;border-radius:3px;
  font-size:12px;font-family:inherit;
}
#chatInput:focus{outline:none;border-color:var(--neon-green)}
#chatSend{
  background:transparent;border:1px solid var(--neon-green);
  color:var(--neon-green);padding:4px 8px;border-radius:3px;
  cursor:pointer;font-size:11px;font-family:inherit;
}

/* ======================== 结算覆盖层 ======================== */
#settlement{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(10,10,18,0.85);z-index:100;
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
#settlement.active{display:flex}
#settlement .panel{
  background:var(--bg-card);border:1px solid var(--neon-green);
  padding:40px 60px;border-radius:8px;text-align:center;
  box-shadow:0 0 30px rgba(0,255,156,0.3);
}
#settlement .result-title{
  font-size:32px;letter-spacing:8px;margin-bottom:16px;
}
#settlement .win{color:var(--neon-green);text-shadow:0 0 15px var(--neon-green)}
#settlement .lose{color:var(--neon-orange);text-shadow:0 0 15px var(--neon-orange)}
#settlement .info{color:var(--text-dim);margin:4px 0;font-size:13px}
#settlement .info .v{color:var(--text-bright)}

/* ======================== 提示 ======================== */
#toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:var(--bg-card);border:1px solid var(--neen-orange);
  color:var(--text-bright);padding:8px 20px;border-radius:4px;
  z-index:200;display:none;font-size:13px;
  box-shadow:0 0 10px rgba(255,107,53,0.3);
}
#toast.active{display:block;animation:toast-in .3s ease}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ======================== 叫地主面板 ======================== */
#bidPanel{
  display:flex;gap:10px;justify-content:center;
  padding:6px;
}
#bidPanel .btn{padding:8px 16px;font-size:13px}

/* ======================== 出牌按钮面板 ======================== */
#playControls{display:flex;gap:10px;justify-content:center;padding:6px}
#playControls .btn{padding:8px 20px;font-size:13px}

/* ======================== 状态提示 ======================== */
.status-hint{
  color:var(--text-dim);font-size:12px;text-align:center;padding:4px;
  letter-spacing:1px;
}
.status-hint.urgent{color:var(--neon-orange);animation:blink 1s ease infinite}
@keyframes blink{50%{opacity:0.5}}

/* 滚动条 */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg-dark)}
::-webkit-scrollbar-thumb{background:rgba(0,255,156,0.2);border-radius:3px}

/* ======================== 横屏适配 (landscape + 小高度) ======================== */
@media (orientation: landscape) and (max-height: 500px) {

  /* 大厅：竖排改横排，压缩字号和间距 */
  #lobby {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 16px;
    overflow-y: auto;
  }
  #lobby h1 {
    font-size: 24px;
    letter-spacing: 4px;
    width: 100%;
    text-align: center;
    margin-bottom: 0;
  }
  #lobby .subtitle {
    display: none;
  }
  #lobby input {
    width: 180px;
    padding: 8px 12px;
    font-size: 14px;
  }
  #lobby .room-row input {
    width: 110px;
  }
  .btn {
    padding: 8px 16px;
    font-size: 12px;
  }

  /* 等待室：压缩间距，房间码缩小 */
  #waiting {
    gap: 8px;
    padding: 8px;
    overflow-y: auto;
  }
  #waiting h2 {
    font-size: 16px;
    letter-spacing: 2px;
  }
  #roomCodeDisplay {
    font-size: 24px;
    letter-spacing: 6px;
  }
  .waiting-player {
    padding: 6px 14px;
    width: 160px;
    font-size: 12px;
  }
  #countdown {
    font-size: 14px;
  }

  /* 游戏界面：顶栏压缩 */
  #topBar {
    padding: 3px 10px;
    font-size: 11px;
    gap: 12px;
  }

  /* 聊天侧栏：横屏时收窄 */
  #chatPanel {
    width: 160px;
    font-size: 11px;
  }

  /* 底部手牌区：压缩高度 */
  #myHandArea {
    min-height: 60px;
    padding: 4px 6px;
  }
  #bottomCards {
    min-height: 50px;
  }

  /* 结算面板：压缩内边距 */
  #settlement .panel {
    padding: 16px 28px;
  }
  #settlement .result-title {
    font-size: 22px;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
}

/* ======================== iOS Safari 视口修复 ======================== */
html, body {
  height: 100dvh;
}
.screen {
  height: 100dvh;
}

/* 底部安全区（刘海屏/全面屏） */
#myHandArea {
  padding-bottom: max(6px, env(safe-area-inset-bottom));
}
#playControls, #bidPanel {
  padding-bottom: max(4px, env(safe-area-inset-bottom));
}

/* ======================== 触摸体验 ======================== */
* { -webkit-tap-highlight-color: transparent; }
.chat-msg { -webkit-user-select: none; user-select: none; }
#chatMessages, #myHandArea {
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
body { overscroll-behavior-y: contain; }
</style>
</head>
<body>

<!-- 扫描线 -->
<div class="scanlines"></div>

<!-- ============ 大厅 ============ -->
<div id="lobby" class="screen active">
  <h1>斗地主</h1>
  <div class="subtitle">DDZ MULTIPLAYER PROTOTYPE</div>
  <input id="nickInput" placeholder="输入昵称" maxlength="10">
  <button class="btn" id="createBtn">创建房间</button>
  <div class="room-row">
    <input id="roomInput" placeholder="房间码" maxlength="6">
    <button class="btn orange" id="joinBtn">加入房间</button>
  </div>
</div>

<!-- ============ 等待室 ============ -->
<div id="waiting" class="screen">
  <h2>等待玩家加入</h2>
  <div>房间码</div>
  <div id="roomCodeDisplay">------</div>
  <div id="playerSlots"></div>
  <div id="countdown"></div>
  <button class="btn purple" id="startEarlyBtn" style="display:none">提前开始(AI补位)</button>
</div>

<!-- ============ 游戏界面 ============ -->
<div id="game" class="screen">
  <div id="topBar">
    <span><span class="label">房间:</span> <span class="val" id="roomLabel">--</span></span>
    <span><span class="label">阶段:</span> <span class="val" id="phaseLabel">--</span></span>
    <span><span class="label">倍数:</span> <span class="mult" id="multLabel">×1</span></span>
    <span id="turnLabel" style="margin-left:auto"></span>
  </div>
  <div id="gameBody">
    <div id="boardWrap">
      <!-- 对手区域 -->
      <div class="opponents">
        <div class="opponent" id="opp-left">
          <div class="name">--</div>
          <div class="role"></div>
          <div class="card-count">0</div>
          <div class="card-backs"></div>
          <div class="timer-ring"></div>
        </div>
        <div class="opponent" id="opp-right">
          <div class="name">--</div>
          <div class="role"></div>
          <div class="card-count">0</div>
          <div class="card-backs"></div>
          <div class="timer-ring"></div>
        </div>
      </div>

      <!-- 底牌区 -->
      <div id="bottomCards">
        <span class="label">底牌:</span>
      </div>

      <!-- 出牌区 -->
      <div id="playArea">
        <div class="empty-hint">等待出牌...</div>
      </div>

      <!-- 我的手牌 -->
      <div id="myHandArea">
        <span class="empty-hand">等待发牌...</span>
      </div>

      <!-- 控制区 -->
      <div id="controls">
        <div class="status-hint" id="statusHint"></div>
      </div>
    </div>

    <!-- 聊天侧栏 -->
    <div id="chatSidebar">
      <h3>聊天 / CHAT</h3>
      <div id="chatMessages"></div>
      <div id="chatInputRow">
        <input id="chatInput" placeholder="发送消息..." maxlength="50">
        <button id="chatSend">发送</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 结算覆盖层 ============ -->
<div id="settlement">
  <div class="panel">
    <div class="result-title" id="resultTitle"></div>
    <div class="info">身份: <span class="v" id="resultRole"></span></div>
    <div class="info">倍数: <span class="v" id="resultMult"></span></div>
    <div class="info">炸弹: <span class="v" id="resultBombs"></span></div>
    <div class="info" id="resultSpring"></div>
    <button class="btn" id="closeSettlement">关闭</button>
  </div>
</div>

<!-- ============ 提示 ============ -->
<div id="toast"></div>

<!-- ============ 脚本依赖 ============ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/games/strategy-core.js"></script>
<script src="js/games/deck.js"></script>
<script src="js/games/ddz-rules.js"></script>
<script src="js/games/ddz-engine.js"></script>
<script src="js/games/ddz-ai.js"></script>
<script src="js/games/card-counter.js"></script>

<script>
'use strict';

const SB_URL = 'https://cddkniwbhvcbfgkgomtl.supabase.co';

// ======================== DOM 工具 ========================
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function toast(msg, ms){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('active');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('active'), ms || 2000);
}

// ======================== 卡牌渲染 ========================
function renderCard(card, opts){
  opts = opts || {};
  const div = el('div', 'card');
  div.dataset.id = card.id;
  if(card.joker){
    div.classList.add(card.joker === 'big' ? 'joker-big' : 'joker-small');
    div.appendChild(el('span','rank', card.joker === 'big' ? 'JOKER' : 'joker'));
    div.appendChild(el('span','suit', '★'));
  } else {
    const isRed = card.suit === '♥' || card.suit === '♦';
    div.classList.add(isRed ? 'red' : 'black');
    div.appendChild(el('span','rank', CARD_LABELS[card.rank]));
    div.appendChild(el('span','suit', card.suit));
  }
  if(opts.selected) div.classList.add('selected');
  if(opts.disabled) div.classList.add('disabled');
  if(opts.played) div.classList.add('played');
  if(opts.onClick) div.addEventListener('click', opts.onClick);
  return div;
}

function renderCardBack(mini){
  return el('div', 'card back' + (mini ? ' mini' : ''));
}

// ======================== Supabase 初始化 ========================
function initSupabase(){
  if(sb) return;
  sb = supabase.createClient(SB_URL, SB_ANON, {
    auth: { persistSession:false, autoRefreshToken:false }
  });
}

// ======================== 频道广播 ========================
function broadcast(payload){
  if(!channel) return;
  payload._from = clientId;
  channel.send({ type:'broadcast', event:'msg', payload });
}

function setupChannel(code){
  initSupabase();
  if(channel){ try{ channel.unsubscribe(); }catch(_){} }
  channel = sb.channel('ddz-room-' + code, {
    config: { broadcast: { self:false } }
  });
  channel.on('broadcast', { event:'msg' }, ({payload}) => {
    if(!payload || payload._from === clientId) return;
    handleMessage(payload);
  });
  channel.subscribe((status) => {
    if(status === 'SUBSCRIBED' && isHost === false && myNick){
      // 加入方广播 join
      broadcast({ type:'join', nick: myNick });
    } else if(status === 'SUBSCRIBED' && isHost === true){
      // 房主也广播自己的 roster
      broadcastRoster();
    }
  });
}

// ======================== 消息处理 ========================
function handleMessage(msg){
  switch(msg.type){
    case 'join':       onPeerJoin(msg); break;
    case 'roster':     onRoster(msg); break;
    case 'start':      onGameStart(msg); break;
    case 'call':       onRemoteCall(msg); break;
    case 'play':       onRemotePlay(msg); break;
    case 'pass':       onRemotePass(msg); break;
    case 'chat':       onChat(msg); break;
    case 'leave':      onPeerLeave(msg); break;
  }
}

// ======================== 大厅逻辑 ========================
$('createBtn').addEventListener('click', () => {
  myNick = $('nickInput').value.trim();
  if(!myNick){ toast('请输入昵称'); return; }
  roomCode = generateRoomCode();
  isHost = true;
  mySeat = 0;
  roster = [{ nick: myNick, seat: 0, isAI: false }];
  setupChannel(roomCode);
  showWaitingRoom();
  startAIFillTimer();
});

$('joinBtn').addEventListener('click', () => {
  myNick = $('nickInput').value.trim();
  roomCode = $('roomInput').value.trim().toUpperCase();
  if(!myNick){ toast('请输入昵称'); return; }
  if(roomCode.length !== 6){ toast('房间码需6位'); return; }
  isHost = false;
  setupChannel(roomCode);
  showWaitingRoom();
  // 等待 SUBSCRIBED 后广播 join（在 setupChannel 的回调中处理）
});

function generateRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

// ======================== 等待室 ========================
function showWaitingRoom(){
  showScreen('waiting');
  $('roomCodeDisplay').textContent = roomCode;
  renderWaitingPlayers();
  if(isHost){
    $('startEarlyBtn').style.display = 'block';
    $('startEarlyBtn').onclick = () => {
      fillAIAndStart();
    };
  }
}

function renderWaitingPlayers(){
  const container = $('playerSlots');
  container.innerHTML = '';
  for(let i=0;i<3;i++){
    const p = roster.find(r => r.seat === i);
    const div = el('div', 'waiting-player');
    if(p){
      div.textContent = (i === 0 ? '★ ' : '') + p.nick + (p.isAI ? ' (AI)' : '');
      if(i === 0) div.classList.add('host');
      if(p.isAI) div.classList.add('ai');
    } else {
      div.textContent = '等待加入...';
      div.classList.add('ai');
    }
    container.appendChild(div);
  }
}

function startAIFillTimer(){
  if(aiTimer) clearTimeout(aiTimer);
  let remaining = AI_FILL_TIMEOUT / 1000;
  updateCountdown(remaining);
  aiTimer = setInterval(() => {
    remaining--;
    updateCountdown(remaining);
    if(remaining <= 0){
      clearInterval(aiTimer);
      aiTimer = null;
      fillAIAndStart();
    }
  }, 1000);
}

function updateCountdown(sec){
  $('countdown').textContent = sec > 0 ? `AI 补位倒计时: ${sec}s` : '';
}

function fillAIAndStart(){
  if(!isHost) return;
  if(aiTimer){ clearInterval(aiTimer); aiTimer = null; }
  // 补位 AI
  for(let i=0;i<3;i++){
    if(!roster.find(r => r.seat === i)){
      roster.push({ nick: 'AI-' + ['甲','乙','丙'][i], seat: i, isAI: true });
    }
  }
  // 生成 seed 并开始
  const seed = (typeof EHDeck !== 'undefined' && EHDeck.freshSeed) ? EHDeck.freshSeed() : Math.floor(Math.random()*0xffffffff);
  broadcast({ type:'start', seed, players: roster.map(r => ({nick:r.nick, seat:r.seat, isAI:r.isAI})) });
  startGame(seed, roster);
}

function onPeerJoin(msg){
  if(!isHost) return;
  // 添加到 roster
  if(roster.length >= 3) return;
  const existing = roster.find(r => r.nick === msg.nick);
  if(existing) return;
  // 找空位
  for(let i=0;i<3;i++){
    if(!roster.find(r => r.seat === i)){
      roster.push({ nick: msg.nick, seat: i, isAI: false });
      break;
    }
  }
  broadcastRoster();
  // 3人到齐自动开始
  if(roster.length >= 3 && roster.every(r => !r.isAI)){
    fillAIAndStart(); // 不补 AI，直接用现有 3 人
    // 但 fillAIAndStart 会检查空位——此时无空位，直接开始
  }
}

function broadcastRoster(){
  broadcast({ type:'roster', players: roster.map(r => ({nick:r.nick, seat:r.seat, isAI:r.isAI})) });
  renderWaitingPlayers();
}

function onRoster(msg){
  roster = msg.players || [];
  // 找自己的座位
  const me = roster.find(r => r.nick === myNick && !r.isAI);
  if(me) mySeat = me.seat;
  renderWaitingPlayers();
}

function onPeerLeave(msg){
  if(!isHost) return;
  roster = roster.filter(r => r.nick !== msg.nick);
  broadcastRoster();
  renderWaitingPlayers();
}

// ======================== 游戏开始 ========================
function onGameStart(msg){
  roster = msg.players || [];
  const me = roster.find(r => r.nick === myNick && !r.isAI);
  if(me) mySeat = me.seat;
  startGame(msg.seed, roster);
}

function startGame(seed, players){
  const names = [0,1,2].map(i => {
    const p = players.find(pl => pl.seat === i);
    return p ? p.nick : ('AI-'+i);
  });
  const isAI = [0,1,2].map(i => {
    const p = players.find(pl => pl.seat === i);
    return p ? !!p.isAI : true;
  });

  game = EHDdzEngine.createGame({
    seed: seed,
    names: names,
    isAI: isAI,
    ids: [0,1,2].map(i => 'p'+i)
  });

  showScreen('game');
  $('roomLabel').textContent = roomCode;
  addChatMsg('system', '系统', '游戏开始! 种子: ' + seed);
  updateUI();

  // 如果地主首叫方是 AI，主机处理
  maybeHandleAITurn();
}

// ======================== 叫地主 ========================
function onRemoteCall(msg){
  if(!game) return;
  try {
    EHDdzEngine.applyCall(game, msg.seat, msg.val);
    addChatMsg('system', '系统', seatName(msg.seat) + (msg.val === 0 ? ' 不叫' : ' 叫 ' + msg.val + ' 分'));
    updateUI();
    maybeHandleAITurn();
  } catch(e){ console.error('call error', e); }
}

function doCall(val){
  if(!game || game.phase !== 'bid') return;
  if(game.bid.turn !== mySeat) return;
  try {
    EHDdzEngine.applyCall(game, mySeat, val);
    broadcast({ type:'call', seat: mySeat, val: val });
    addChatMsg('system', '系统', (val === 0 ? '你不叫' : '你叫 ' + val + ' 分'));
    updateUI();
    maybeHandleAITurn();
  } catch(e){ toast(e.message); }
}

// ======================== 出牌 ========================
function onRemotePlay(msg){
  if(!game) return;
  try {
    const cards = msg.cardIds.map(id => ({id}));
    EHDdzEngine.applyPlay(game, msg.seat, cards);
    updateUI();
    maybeHandleAITurn();
  } catch(e){ console.error('play error', e); }
}

function onRemotePass(msg){
  if(!game) return;
  try {
    EHDdzEngine.applyPass(game, msg.seat);
    updateUI();
    maybeHandleAITurn();
  } catch(e){ console.error('pass error', e); }
}

function doPlay(){
  if(!game || game.phase !== 'play') return;
  if(game.turn !== mySeat) return;
  const hand = EHDdzEngine.handOf(game, mySeat);
  const cards = hand.filter(c => selectedCards.has(c.id));
  if(cards.length === 0){ toast('请选择牌'); return; }
  try {
    EHDdzEngine.applyPlay(game, mySeat, cards);
    broadcast({ type:'play', seat: mySeat, cardIds: cards.map(c => c.id) });
    selectedCards.clear();
    updateUI();
    maybeHandleAITurn();
  } catch(e){ toast(e.message); }
}

function doPass(){
  if(!game || game.phase !== 'play') return;
  if(game.turn !== mySeat) return;
  try {
    EHDdzEngine.applyPass(game, mySeat);
    broadcast({ type:'pass', seat: mySeat });
    selectedCards.clear();
    updateUI();
    maybeHandleAITurn();
  } catch(e){ toast(e.message); }
}

// ======================== AI 处理 ========================
function maybeHandleAITurn(){
  if(!game) return;
  if(game.phase === 'over'){ showSettlement(); return; }

  const turnSeat = game.phase === 'bid' ? game.bid.turn : game.turn;
  const player = game.players[turnSeat];
  if(!player || !player.isAI) return;

  // 只有 host 处理 AI
  if(!isHost) return;

  clearTimeout(aiTurnTimer);
  aiTurnTimer = setTimeout(() => {
    if(game.phase === 'bid'){
      aiDoBid(turnSeat);
    } else if(game.phase === 'play'){
      aiDoPlay(turnSeat);
    }
  }, AI_TURN_DELAY);
}

function aiDoBid(seat){
  if(!game || game.phase !== 'bid') return;
  const hand = EHDdzEngine.handOf(game, seat);
  const val = EHDdzAI.chooseBid(hand, game.bid.max);
  try {
    EHDdzEngine.applyCall(game, seat, val);
    broadcast({ type:'call', seat, val });
    addChatMsg('system', '系统', seatName(seat) + (val === 0 ? ' 不叫' : ' 叫 ' + val + ' 分'));
    updateUI();
    maybeHandleAITurn();
  } catch(e){ console.error('AI bid error', e); }
}

function aiDoPlay(seat){
  if(!game || game.phase !== 'play') return;
  const hand = EHDdzEngine.handOf(game, seat);
  const tableParse = (game.table.lastPlay && game.table.lastPlay.seat !== seat)
    ? game.table.lastPlay.parse : null;

  const ctx = {
    hand: hand,
    tableParse: tableParse,
    seat: seat,
    landlord: game.landlord,
    lastSeat: game.table.lastPlay ? game.table.lastPlay.seat : null,
    handsLeft: game.players.map(p => p.hand.length),
    log: game.log,
    coop: true,
  };

  let decision;
  try {
    decision = EHDdzAI.decide(ctx);
  } catch(e){
    console.error('AI decide error', e);
    decision = { action: 'pass' };
  }

  try {
    if(decision.action === 'play' && decision.cards && decision.cards.length > 0){
      EHDdzEngine.applyPlay(game, seat, decision.cards);
      broadcast({ type:'play', seat, cardIds: decision.cards.map(c => c.id) });
    } else {
      // 如果不能过(leader)，尝试出最小的单张
      if(!game.table.lastPlay || game.table.lastPlay.seat === seat){
        // leader 必须出牌，找最小的单张
        const sorted = hand.slice().sort((a,b) => a.rank - b.rank);
        if(sorted.length > 0){
          EHDdzEngine.applyPlay(game, seat, [sorted[0]]);
          broadcast({ type:'play', seat, cardIds: [sorted[0].id] });
        }
      } else {
        EHDdzEngine.applyPass(game, seat);
        broadcast({ type:'pass', seat });
      }
    }
    updateUI();
    maybeHandleAITurn();
  } catch(e){
    console.error('AI play error', e, 'seat', seat);
    // fallback: pass or play smallest
    try {
      if(game.table.lastPlay && game.table.lastPlay.seat !== seat){
        EHDdzEngine.applyPass(game, seat);
        broadcast({ type:'pass', seat });
      } else {
        const sorted = hand.slice().sort((a,b) => a.rank - b.rank);
        if(sorted.length > 0){
          EHDdzEngine.applyPlay(game, seat, [sorted[0]]);
          broadcast({ type:'play', seat, cardIds: [sorted[0].id] });
        }
      }
      updateUI();
      maybeHandleAITurn();
    } catch(e2){ console.error('AI fallback error', e2); }
  }
}

// ======================== UI 渲染 ========================
function updateUI(){
  if(!game) return;

  // 顶栏
  const phaseNames = { bid:'叫地主', play:'出牌', over:'结束', double:'加倍' };
  $('phaseLabel').textContent = phaseNames[game.phase] || game.phase;
  $('multLabel').textContent = '×' + game.multiplier;
  $('turnLabel').textContent = game.phase === 'bid'
    ? '轮到 ' + seatName(game.bid.turn) + ' 叫地主'
    : (game.phase === 'play' ? '轮到 ' + seatName(game.turn) + ' 出牌' : '');

  // 对手区域
  renderOpponents();

  // 底牌
  renderBottomCards();

  // 出牌区
  renderPlayArea();

  // 我的手牌
  renderMyHand();

  // 控制区
  renderControls();
}

function renderOpponents(){
  // 左 = 上家 (seat - 1 + 3) % 3，右 = 下家 (seat + 1) % 3
  const leftSeat = (mySeat + 2) % 3;
  const rightSeat = (mySeat + 1) % 3;
  renderOpponent($('opp-left'), leftSeat);
  renderOpponent($('opp-right'), rightSeat);
}

function renderOpponent(container, seat){
  const p = game.players[seat];
  const nameEl = container.querySelector('.name');
  const roleEl = container.querySelector('.role');
  const countEl = container.querySelector('.card-count');
  const backsEl = container.querySelector('.card-backs');

  nameEl.textContent = p.name;
  countEl.textContent = p.hand.length;

  // 角色
  roleEl.className = 'role';
  if(game.landlord === seat){
    roleEl.textContent = '地主';
    roleEl.classList.add('landlord');
  } else if(game.landlord !== null){
    roleEl.textContent = '农民';
    roleEl.classList.add('peasant');
  } else {
    roleEl.textContent = '';
  }

  // 当前轮次高亮
  const currentTurn = game.phase === 'bid' ? game.bid.turn : (game.phase === 'play' ? game.turn : -1);
  container.classList.toggle('active', currentTurn === seat);
  container.classList.toggle('turn', currentTurn === seat && p.isAI);

  // 牌背
  backsEl.innerHTML = '';
  const showCount = Math.min(p.hand.length, 8);
  for(let i=0;i<showCount;i++){
    backsEl.appendChild(renderCardBack(true));
  }
}

function renderBottomCards(){
  const container = $('bottomCards');
  // 保留 label
  const label = container.querySelector('.label');
  container.innerHTML = '';
  container.appendChild(label);

  if(game.bottom && game.bottom.length > 0){
    const revealed = game.landlord !== null; // 地主确定后亮底牌
    for(const card of game.bottom){
      if(revealed){
        const c = renderCard(card, { played:true });
        c.classList.add('flip-anim');
        container.appendChild(c);
      } else {
        const back = renderCardBack(false);
        container.appendChild(back);
      }
    }
  }
}

function renderPlayArea(){
  const container = $('playArea');
  container.innerHTML = '';

  if(game.table.lastPlay && game.table.lastPlay.seat !== null){
    const lastPlay = game.table.lastPlay;
    const playedBy = el('div', 'played-by', seatName(lastPlay.seat) + ' 出牌');
    container.appendChild(playedBy);

    const zone = el('div', 'played-zone');
    // lastPlay.cards 是 id 数组，从手牌或已出牌中找
    // 引擎里 lastPlay.cards 存的是 id 数组
    const ids = lastPlay.cards;
    // 构建临时 card 对象用于渲染
    for(const id of ids){
      const card = idToCard(id);
      if(card){
        zone.appendChild(renderCard(card, { played:true }));
      }
    }
    container.appendChild(zone);
  } else if(game.phase === 'play'){
    // 新一轮，无人出牌
    const hint = el('div', 'empty-hint', '新的一轮，请出牌');
    container.appendChild(hint);
  } else if(game.phase === 'bid'){
    const hint = el('div', 'empty-hint', '叫地主阶段');
    container.appendChild(hint);
  }
}

function renderMyHand(){
  const container = $('myHandArea');
  container.innerHTML = '';
  const hand = EHDdzEngine.handOf(game, mySeat);
  if(!hand || hand.length === 0){
    container.appendChild(el('span', 'empty-hand', '无手牌'));
    return;
  }
  const isMyTurn = game.phase === 'play' && game.turn === mySeat;
  for(const card of hand){
    const c = renderCard(card, {
      selected: selectedCards.has(card.id),
      disabled: !isMyTurn,
      onClick: () => {
        if(!isMyTurn) return;
        if(selectedCards.has(card.id)){
          selectedCards.delete(card.id);
        } else {
          selectedCards.add(card.id);
        }
        renderMyHand();
      }
    });
    container.appendChild(c);
  }
}

function renderControls(){
  const container = $('controls');
  container.innerHTML = '';

  if(game.phase === 'bid'){
    renderBidControls(container);
  } else if(game.phase === 'play'){
    renderPlayControls(container);
  } else if(game.phase === 'over'){
    const hint = el('div', 'status-hint', '游戏结束');
    container.appendChild(hint);
  }
}

function renderBidControls(container){
  if(game.bid.turn === mySeat){
    // 我的叫牌回合
    const panel = el('div', '', '');
    panel.id = 'bidPanel';
    const max = game.bid.max;
    for(let v=0; v<=3; v++){
      const btn = el('button', 'btn ' + (v === 0 ? 'orange' : ''));
      btn.textContent = v === 0 ? '不叫' : (v + '分');
      btn.disabled = (v !== 0 && v <= max);
      btn.onclick = () => doCall(v);
      panel.appendChild(btn);
    }
    container.appendChild(panel);
  } else {
    const hint = el('div', 'status-hint', '等待 ' + seatName(game.bid.turn) + ' 叫地主...');
    container.appendChild(hint);
  }
}

function renderPlayControls(container){
  if(game.turn === mySeat){
    const panel = el('div', '', '');
    panel.id = 'playControls';
    const isLeader = !game.table.lastPlay || game.table.lastPlay.seat === mySeat;

    const playBtn = el('button', 'btn', '出牌');
    playBtn.onclick = doPlay;
    panel.appendChild(playBtn);

    if(!isLeader){
      const passBtn = el('button', 'btn orange', '不要');
      passBtn.onclick = doPass;
      panel.appendChild(passBtn);
    }

    // 提示按钮
    const hintBtn = el('button', 'btn purple', '提示');
    hintBtn.onclick = showHint;
    panel.appendChild(hintBtn);

    container.appendChild(panel);
  } else {
    const hint = el('div', 'status-hint', '等待 ' + seatName(game.turn) + ' 出牌...');
    container.appendChild(hint);
  }
}

// ======================== 提示 ========================
function showHint(){
  if(!game || game.phase !== 'play' || game.turn !== mySeat) return;
  const hand = EHDdzEngine.handOf(game, mySeat);
  const target = (game.table.lastPlay && game.table.lastPlay.seat !== mySeat)
    ? game.table.lastPlay.parse : null;
  try {
    const ctx = {
      hand: hand,
      tableParse: target,
      seat: mySeat,
      landlord: game.landlord,
      lastSeat: game.table.lastPlay ? game.table.lastPlay.seat : null,
      handsLeft: game.players.map(p => p.hand.length),
      log: game.log,
      coop: true,
    };
    const hints = EHDdzAI.hints(hand, target, ctx);
    if(hints && hints.length > 0){
      // 显示第一个提示
      selectedCards.clear();
      const first = hints[0];
      if(first.cards){
        first.cards.forEach(c => selectedCards.add(c.id));
      }
      renderMyHand();
      toast('提示: ' + (first.parse ? first.parse.type : ''));
    } else {
      toast('没有可出的牌');
    }
  } catch(e){ toast('提示不可用'); }
}

// ======================== 结算 ========================
function showSettlement(){
  if(!game || !game.result) return;
  const r = game.result;
  const panel = $('settlement');
  const title = $('resultTitle');
  const iWon = r.winners.includes(mySeat);

  title.textContent = iWon ? '胜利' : '失败';
  title.className = 'result-title ' + (iWon ? 'win' : 'lose');

  const isLord = game.landlord === mySeat;
  $('resultRole').textContent = isLord ? '地主' : '农民';
  $('resultMult').textContent = '×' + r.finalMultiplier;
  $('resultBombs').textContent = r.bombs;
  $('resultSpring').textContent = r.spring ? (r.landlordWon ? '春天!' : '反春天!') : '';
  $('resultSpring').className = 'info' + (r.spring ? '' : '');
  if(r.spring){
    $('resultSpring').style.color = r.landlordWon ? 'var(--neon-orange)' : 'var(--neon-green)';
  } else {
    $('resultSpring').style.color = 'var(--text-dim)';
    $('resultSpring').textContent = '';
  }

  panel.classList.add('active');
}

$('closeSettlement').addEventListener('click', () => {
  $('settlement').classList.remove('active');
});

// ======================== 聊天 ========================
$('chatSend').addEventListener('click', sendChat);
$('chatInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') sendChat();
});

function sendChat(){
  const text = $('chatInput').value.trim();
  if(!text) return;
  $('chatInput').value = '';
  addChatMsg('user', myNick, text);
  broadcast({ type:'chat', nick: myNick, text: text });
}

function onChat(msg){
  addChatMsg('user', msg.nick, msg.text);
}

function addChatMsg(kind, nick, text){
  const container = $('chatMessages');
  const div = el('div', 'chat-msg ' + (kind === 'system' ? 'system' : ''));
  const nickSpan = el('span', 'nick', nick + ':');
  const textSpan = el('span', 'text', text);
  div.appendChild(nickSpan);
  div.appendChild(textSpan);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ======================== 工具函数 ========================
function seatName(seat){
  if(!game || !game.players[seat]) return '席' + seat;
  const p = game.players[seat];
  if(seat === mySeat) return '你';
  return p.name;
}

function idToCard(id){
  if(id === 'jb') return { rank:17, suit:null, joker:'big', label:'W', id:'jb' };
  if(id === 'js') return { rank:16, suit:null, joker:'small', label:'w', id:'js' };
  const m = /^([shcd])(\d+)$/.exec(id);
  if(!m) return null;
  const suitMap = { s:'♠', h:'♥', c:'♣', d:'♦' };
  const rank = parseInt(m[2], 10);
  return { rank:rank, suit:suitMap[m[1]], joker:null, label:CARD_LABELS[rank], id:id };
}

// ======================== 初始化 ========================
// 输入框聚焦
$('nickInput').focus();

// 离开时广播
window.addEventListener('beforeunload', () => {
  if(channel && myNick){
    broadcast({ type:'leave', nick: myNick });
  }
});

</script>
