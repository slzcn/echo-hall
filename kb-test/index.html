<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
<title>KB Test · 最小键盘协同 demo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#0b0f1a;color:#dfe;font:14px/1.5 -apple-system,system-ui,sans-serif;overflow:hidden}
  /* ★核心：stage 高度由 JS 恒等于 visualViewport.height（唯一动态源）。
     不用 100vh/100dvh/100svh 做最终定位，避开安卓 PWA + interactive-widget 的坑。 */
  .stage{
    position:fixed;left:0;top:0;width:100%;
    /* 首屏回退：JS 未接管前用 svh，避免闪一下 */
    height:100svh;
    display:flex;flex-direction:column
  }
  .top{padding:14px 16px;background:#111827;border-bottom:1px solid #1f2937;flex-shrink:0}
  .top h1{font-size:15px;color:#8ef}
  .top p{font-size:11px;color:#6b7c93;margin-top:3px}
  .stream{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .msg{background:#1a2436;padding:8px 12px;border-radius:10px;font-size:13px;max-width:80%}
  .msg.me{align-self:flex-end;background:#1e3a5f}
  .composer{
    flex-shrink:0;
    display:flex;gap:8px;
    padding:10px 12px 15px 12px; /* ★底部 15px 决定输入框贴底距离 */
    border-top:1px solid #1f2937;background:#0f1420
  }
  .cin-wrap{
    flex:1;min-height:44px;
    background:#1a2436;border:1px solid #2d3a52;border-radius:10px;
    display:flex;align-items:flex-end;padding:2px 12px
  }
  .cin{
    flex:1;border:none;outline:none;background:none;color:#dfe;
    font-size:16px; /* iOS 16px 防聚焦缩放 */
    resize:none;padding:10px 0;
    line-height:1.4;height:24px;min-height:24px;max-height:100px;
    font-family:inherit
  }
  .send{
    padding:0 16px;height:44px;border:none;border-radius:10px;
    background:#4a90e2;color:#fff;font-size:14px;cursor:pointer
  }
  /* 诊断浮层 */
  .dbg{
    position:fixed;left:6px;top:6px;z-index:999;
    background:rgba(0,0,0,.86);color:#0ff;
    font:10px/1.35 monospace;padding:6px 8px;
    border:1px solid #0ff;border-radius:5px;
    pointer-events:none;white-space:pre;max-width:80vw
  }
  .trace{
    position:fixed;left:6px;bottom:6px;z-index:999;
    background:rgba(20,0,0,.9);color:#fd6;
    font:10px/1.35 monospace;padding:6px 8px;
    border:1px solid #fd6;border-radius:5px;
    pointer-events:none;white-space:pre;max-width:88vw
  }
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <h1>KB 最小测试 · demo</h1>
    <p>验收：输入框底距键盘顶（或屏底）恒 15px；键盘弹起后输入框跟随上去</p>
  </div>
  <div class="stream" id="stream">
    <div class="msg">消息 1：这是一条测试消息</div>
    <div class="msg me">消息 2：这是我发的</div>
    <div class="msg">消息 3：再来一条</div>
    <div class="msg me">消息 4：占个位</div>
    <div class="msg">消息 5：滚动看看</div>
    <div class="msg">消息 6：更多内容</div>
    <div class="msg me">消息 7：再来</div>
    <div class="msg">消息 8：填满</div>
    <div class="msg me">消息 9：够了没</div>
    <div class="msg">消息 10：最后一条</div>
  </div>
  <div class="composer">
    <div class="cin-wrap">
      <textarea class="cin" id="cin" rows="1" placeholder="点这里，看键盘弹起后是否跟随..."></textarea>
    </div>
    <button class="send" id="send">发送</button>
  </div>
</div>

<div class="dbg" id="dbg"></div>
<div class="trace" id="trace"></div>

<script>
(function(){
  var vv = window.visualViewport;
  var stage = document.querySelector('.stage');
  var cin = document.getElementById('cin');
  var wrap = document.querySelector('.cin-wrap');
  var frame = 0;
  var kbActive = false; // 聊天输入框聚焦=键盘意图激活

  // ★核心：只在键盘意图激活时才把 stage 钉到 vv.height；
  //   失焦（键盘收回）时清空 inline 高度，退回 CSS 满高 100svh。
  //   这样二次聚焦总从满高开始，不会卡在键盘弹起时的小高度。
  function apply(){
    frame = 0;
    if (!vv) return;
    if (kbActive) {
      stage.style.height = Math.round(vv.height) + 'px';
    } else {
      // 未聚焦：释放高度，回 CSS 满屏（避免卡在键盘小高）
      stage.style.height = '';
    }
  }
  function schedule(){
    if (!frame) frame = requestAnimationFrame(apply);
  }

  if (vv){
    vv.addEventListener('resize', schedule, {passive:true});
    vv.addEventListener('scroll', schedule, {passive:true});
  }
  window.addEventListener('orientationchange', function(){ setTimeout(schedule, 250); });
  // focusin 即时刷新一次（键盘弹起前）+ 兜底：如果 vv.resize 迟迟不来，重复采样
  document.addEventListener('focusin', function(e){
    if (e.target !== cin) return;
    kbActive = true;
    schedule();
    [100,250,450,700,1000,1500].forEach(function(ms){ setTimeout(schedule, ms); });
  });
  document.addEventListener('focusout', function(e){
    if (e.target !== cin) return;
    kbActive = false;
    schedule(); // 立即释放高度
    // 兜底：键盘收回动画期间 vv 陆续变化，多次重采（仅确保最终回满高）
    [100,300,600].forEach(function(ms){ setTimeout(schedule, ms); });
  });

  // 首次应用
  schedule();

  // 发送按钮：追加一条消息
  document.getElementById('send').addEventListener('click', function(){
    var v = cin.value.trim();
    if (!v) return;
    var stream = document.getElementById('stream');
    var d = document.createElement('div');
    d.className = 'msg me';
    d.textContent = v;
    stream.appendChild(d);
    stream.scrollTop = stream.scrollHeight;
    cin.value = '';
  });

  // ==================== 诊断浮层 ====================
  var dbg = document.getElementById('dbg');
  var trace = document.getElementById('trace');
  var traceLines = [];
  function px(v){ return v==null||isNaN(v)?'?':Math.round(v); }

  function snapshot(){
    var wr = wrap.getBoundingClientRect();
    var kbTop = vv ? Math.round(vv.offsetTop + vv.height) : window.innerHeight;
    var gap = kbTop - Math.round(wr.bottom);
    var focused = document.activeElement === cin;
    dbg.textContent = [
      'demo · ' + (focused?'聚焦':'未聚焦'),
      'innerH   = ' + px(window.innerHeight),
      'vv.h     = ' + px(vv && vv.height),
      'vv.top   = ' + px(vv && vv.offsetTop),
      '键盘顶   = ' + kbTop,
      'stageH   = ' + px(parseFloat(getComputedStyle(stage).height)),
      '框底     = ' + px(wr.bottom),
      '★距键盘 = ' + gap + (Math.abs(gap-15)<=2?' ✓':' ✗需15')
    ].join('\n');
    dbg.style.color = Math.abs(gap-15)<=2 ? '#0ff' : '#f66';
    dbg.style.borderColor = Math.abs(gap-15)<=2 ? '#0ff' : '#f66';
  }
  function traceOne(tag){
    var wr = wrap.getBoundingClientRect();
    var kbTop = vv ? Math.round(vv.offsetTop + vv.height) : window.innerHeight;
    var gap = kbTop - Math.round(wr.bottom);
    traceLines.push(tag + ' vv=' + px(vv&&vv.height) + ' stage=' + px(parseFloat(getComputedStyle(stage).height)) + ' 框底=' + px(wr.bottom) + ' 距键盘=' + gap);
    if (traceLines.length > 7) traceLines.shift();
    trace.textContent = '聚焦采样(应=15):\n' + traceLines.join('\n');
  }
  if (vv){
    vv.addEventListener('resize', snapshot, {passive:true});
    vv.addEventListener('scroll', snapshot, {passive:true});
  }
  document.addEventListener('focusin', function(e){
    if (e.target !== cin) return;
    traceLines = [];
    traceOne('t0    ');
    [100,250,450,700,1000,1500].forEach(function(ms){
      setTimeout(function(){ traceOne('t'+String(ms).padEnd(5)); }, ms);
    });
  });
  setInterval(snapshot, 300);
  snapshot();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' });
  });
}
</script>
</body>
</html>
